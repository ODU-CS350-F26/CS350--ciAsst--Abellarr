name: CI - build and test

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Grant execute permision for gradlew
      run: chmod +x gradlew
    - name: Build and test
      working-directory: ./
      run: ./gradlew deployReports